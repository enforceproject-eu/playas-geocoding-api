openapi: 3.0.0
info:
   version: '2.0rc1'
   title: "ENFORCE Playas Geocoding API"
   description: |-
      Adds missing and fixes incorrect location information for data coming from the Manorba App used to report beach cleaning around Barcelona
   contact:
      name: Benjamin Pross
      email: b.pross @52north.org
   license:
      name: Apache License
      url: https://raw.githubusercontent.com/enforceproject-eu/playas-geocoding-api/refs/heads/main/LICENSE
servers:
  - description: |-
       52°North demo server
    url: https://enforce.dev.52north.org/playas-geocoding-api/
paths:
   # OGC API - Common - Part 1: Core
   /:
      $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/paths/common-core/pLandingPage.yaml'
   /conformance:
      $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/paths/common-core/pConformance.yaml'
   /api:
      $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/paths/common-core/pAPI.yaml'

   # OGC API - Processes - Part 1: Core
   /processes:
      # If OGC API - Part 1 only uncomment the line below
      $ref: 'https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/paths/processes-core/pProcessList.yaml'

   /processes/geocode-playas:
      # OGC API - Processes Part 1: Core
      get:
          summary: retrieve a process description
          description:  |
             The process description contains information about inputs and outputs and a link to the execution-endpoint for the process. The Core does not mandate the use of a specific process description to specify the interface of a process. That said, the Core requirements class makes the following recommendation:
          
             Implementations SHOULD consider supporting the OGC process description.
          
             For more information, see [Section 7.8](https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_process_description).
          operationId: getProcessDescription
          tags:
            - Processes
            - Core
          responses:
            200:
              $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/responses/processes-core/rProcessDescription.yaml"
            404:
              $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/responses/common-core/rNotFound.yaml"

   /processes/geocode-playas/execution:
      post:
         summary: execute a process.
         description: |
           Executes a process (this may result in the creation of a job resource e.g., for _asynchronous execution_).
      
           For more information, see [Section 7.9](https://docs.ogc.org/is/18-062r2/18-062r2.html#sc_create_job).
         operationId: execute
         tags:
           - Processes
           - Core
         parameters:
           - $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/parameters/processes-core/response.yaml"
           - $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/parameters/processes-core/prefer-header-execution.yaml"
         requestBody:
           description: An execution request specifying any inputs for the process to execute, and optionally to select specific outputs.
           required: true
           content:
             application/json:
               schema:
                 $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/schemas/processes-core/execute.yaml"
         responses:
           200:
             $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/responses/processes-core/rExecuteSync.yaml"
           404:
             $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/responses/common-core/rNotFound.yaml"
           500:
             $ref: "https://raw.githubusercontent.com/opengeospatial/ogcapi-processes/refs/heads/master/openapi/responses/common-core/rServerError.yaml"

